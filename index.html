<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 2.0 - Suraj Edition</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; }
        .input-area { padding: 20px; background: #1e1e1e; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .user { color: #00ffcc; margin-bottom: 10px; }
        .ai { color: #ffffff; margin-bottom: 20px; background: #333; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask Suraj AI anything...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            const message = input.value;
            if (!message) return;

            // Display User Message
            chatBox.innerHTML += `<div class="user"><b>You:</b> ${message}</div>`;
            input.value = '';

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'ai';
            aiMsgDiv.innerHTML = "<b>Gemini:</b> Thinking...";
            chatBox.appendChild(aiMsgDiv);

            const apiKey = "AIzaSyBeGWkJhOHH0dYlt2Mevwt0RT2UCTf22Ok";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: message }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiMsgDiv.innerHTML = `<b>Gemini:</b> ${data.candidates[0].content.parts[0].text}`;
                } else {
                    aiMsgDiv.innerHTML = "<b>Gemini:</b> Error in response format.";
                }
            } catch (error) {
                aiMsgDiv.innerHTML = "<b>Gemini:</b> Connection Failed. Check your Internet or API Key.";
                console.error(error);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>

                if (!response.ok) {
                    console.error("API Error:", data);

                if (data.candidates && data.candidates[0].content) {

            } catch (error) {
                console.error("Network Error:", error);
                return `⚠️ Network Error: ${error.message}. Please check your connection or CORS settings.`;
            }
        }
        
        // Expose to the React component

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 2.0 - Ultra Fast AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: white; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px; background: #161b22; border-bottom: 1px solid #30363d; text-align: center; color: #58a6ff; font-size: 1.2rem; font-weight: bold; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 15px; line-height: 1.5; font-size: 14px; word-wrap: break-word; }
        .user-msg { align-self: flex-end; background: #238636; color: white; border-bottom-right-radius: 2px; }
        .ai-msg { align-self: flex-start; background: #21262d; color: #c9d1d9; border-bottom-left-radius: 2px; border: 1px solid #30363d; }
        .input-area { padding: 15px; background: #161b22; display: flex; gap: 10px; border-top: 1px solid #30363d; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; }
        button { padding: 10px 20px; background: #238636; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:active { background: #2ea043; }
    </style>
</head>
<body>

<header>✨ Gemini 2.0 AI Assistant</header>

<div id="chat-container">
    <div class="message ai-msg">Hello Suraj! Main Gemini 2.0 hoon. Main apki kaise madad kar sakta hoon?</div>
</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Kuch bhi puchiye..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
    const API_KEY = "AIzaSyBeGWkJhOHH0dYlt2Mevwt0RT2UCTf22Ok";
    const MODEL = "gemini-1.5-flash"; // Ye sabse stable hai

    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const container = document.getElementById('chat-container');
        const text = inputField.value.trim();

        if (!text) return;

        // User Message Display
        container.innerHTML += `<div class="message user-msg">${text}</div>`;
        inputField.value = '';
        container.scrollTop = container.scrollHeight;

        // AI Typing Status
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message ai-msg';
        loadingDiv.innerText = 'AI is thinking...';
        container.appendChild(loadingDiv);
        container.scrollTop = container.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                loadingDiv.innerText = data.candidates[0].content.parts[0].text;
            } else {
                loadingDiv.innerText = "Error: Google API ne response nahi diya. Check API settings.";
            }
        } catch (error) {
            loadingDiv.innerText = "Error: Connection fail ho gaya. Internet check karein.";
            console.error(error);
        }
        container.scrollTop = container.scrollHeight;
    }
</script>

</body>
</html>

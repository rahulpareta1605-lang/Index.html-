<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 1.5 Pro - Ultra Fast AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; height: 100vh; margin: 0; overflow: hidden; }
        .glass-effect { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message-anim { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-white text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [messages, setMessages] = useState([
                { role: 'model', content: "Hello! I am Gemini 1.5 Flash. I'm ready to assist you. What's on your mind?", timestamp: Date.now() }
            ]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const messagesEndRef = useRef(null);

            // FIXED API CONFIGURATION
            const apiKey = 'AIzaSyBeGWkJhOHH0dYlt2Mevwt0RT2UCTf22Ok';
            const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + apiKey;

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
                lucide.createIcons();
            }, [messages]);

            const handleSend = async () => {
                if (!input.trim() || isLoading) return;
                
                const userMsg = { role: 'user', content: input, timestamp: Date.now() };
                setMessages(prev => [...prev, userMsg]);
                setInput('');
                setIsLoading(true);

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        mode: 'cors', // Required for GitHub hosting
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: input }]
                            }]
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error?.message || `Error ${response.status}: Failed to reach API`);
                    }

                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "I received an empty response. Please try again.";
                    setMessages(prev => [...prev, { role: 'model', content: aiText, timestamp: Date.now() }]);
                } catch (error) {
                    console.error("Gemini Error:", error);
                    setMessages(prev => [...prev, { 
                        role: 'model', 
                        content: `⚠️ Error: ${error.message}. Please check your connection or API key.`, 
                        timestamp: Date.now() 
                    }]);
                } finally {
                    setIsLoading(false);
                }
            };

            const downloadChat = (format) => {
                let content = format === 'json' 
                    ? JSON.stringify(messages, null, 2) 
                    : messages.map(m => `[${m.role.toUpperCase()}]: ${m.content}`).join('\n\n');
                
                const blob = new Blob([content], { type: format === 'json' ? 'application/json' : 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `gemini-chat.${format}`;
                a.click();
            };

            return (
                <div className="flex h-screen flex-col bg-[#f8fafc]">
                    {/* Header */}
                    <header className="px-6 py-4 border-b border-gray-200 glass-effect flex justify-between items-center z-20">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-black rounded-xl flex items-center justify-center text-white shadow-lg">
                                <i data-lucide="sparkles" className="w-6 h-6"></i>
                            </div>
                            <div>
                                <h1 className="font-bold text-lg leading-tight">Gemini 1.5 Flash</h1>
                                <p className="text-[10px] text-green-500 font-medium flex items-center gap-1">
                                    <span className="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> Online & Fast
                                </p>
                            </div>
                        </div>
                        <div className="flex gap-2">
                             <button onClick={() => downloadChat('txt')} className="p-2.5 hover:bg-white rounded-lg border border-transparent hover:border-gray-200 transition-all text-gray-500" title="Export TXT">
                                <i data-lucide="file-text" className="w-5 h-5"></i>
                            </button>
                            <button onClick={() => downloadChat('json')} className="p-2.5 hover:bg-white rounded-lg border border-transparent hover:border-gray-200 transition-all text-gray-500" title="Export JSON">
                                <i data-lucide="file-json" className="w-5 h-5"></i>
                            </button>
                        </div>
                    </header>

                    {/* Chat Messages */}
                    <main className="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 custom-scrollbar">
                        <div className="max-w-3xl mx-auto">
                            {messages.map((msg, i) => (
                                <div key={i} className={`flex gap-4 mb-8 message-anim ${msg.role === 'user' ? 'flex-row-reverse' : ''}`}>
                                    <div className={`w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 shadow-sm ${msg.role === 'user' ? 'bg-blue-600 text-white' : 'bg-black text-white'}`}>
                                        <i data-lucide={msg.role === 'user' ? 'user' : 'bot'} className="w-5 h-5"></i>
                                    </div>
                                    <div className={`p-4 rounded-2xl max-w-[85%] leading-relaxed ${msg.role === 'user' ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white border border-gray-200 rounded-tl-none shadow-sm text-gray-800'}`}>
                                        <p className="text-sm md:text-base whitespace-pre-wrap">{msg.content}</p>
                                    </div>
                                </div>
                            ))}
                            {isLoading && (
                                <div className="flex gap-4 mb-8 message-anim">
                                    <div className="w-9 h-9 bg-black text-white rounded-xl flex items-center justify-center shadow-sm">
                                        <i data-lucide="bot" className="w-5 h-5"></i>
                                    </div>
                                    <div className="p-4 bg-white border border-gray-200 rounded-2xl rounded-tl-none shadow-sm flex items-center gap-2">
                                        <div className="flex gap-1">
                                            <div className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"></div>
                                            <div className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce [animation-delay:0.2s]"></div>
                                            <div className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce [animation-delay:0.4s]"></div>
                                        </div>
                                    </div>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>
                    </main>

                    {/* Input Container */}
                    <div className="p-4 md:p-8 bg-white border-t border-gray-100">
                        <div className="max-w-3xl mx-auto relative group">
                            <textarea 
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && !e.shiftKey && (e.preventDefault(), handleSend())}
                                placeholder="Ask Gemini something..."
                                className="w-full bg-gray-50 border border-gray-200 rounded-2xl p-4 pr-14 focus:outline-none focus:ring-4 focus:ring-black/5 focus:bg-white focus:border-black min-h-[60px] max-h-48 resize-none text-base transition-all shadow-sm"
                                rows="1"
                            />
                            <button 
                                onClick={handleSend}
                                disabled={!input.trim() || isLoading}
                                className="absolute right-3 bottom-3 p-2.5 bg-black text-white rounded-xl hover:bg-gray-800 disabled:bg-gray-200 disabled:text-gray-400 transition-all active:scale-95 shadow-lg z-10"
                            >
                                <i data-lucide="send" className="w-5 h-5"></i>
                            </button>
                        </div>
                        <p className="text-[10px] text-gray-400 text-center mt-3 uppercase tracking-wider font-semibold">Gemini AI Model • Version 1.5 Flash</p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 1.5 Flash - Fast AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- React & Babel for Single File -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Gemini Fetch Logic -->
    <script type="module">
        const apiKey = 'AIzaSyBeGWkJhOHH0dYlt2Mevwt0RT2UCTf22Ok';
        const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + apiKey;

        async function sendMessage(userMessage) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    mode: 'cors', // Added CORS mode
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: userMessage
                            }]
                        }]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    console.error("API Error:", data);
                    return `⚠️ API Error (${response.status}): ${data.error?.message || "Invalid request format or API key issue."}`;
                }

                if (data.candidates && data.candidates[0].content) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    return "⚠️ Received an empty or unexpected response from the API.";
                }
            } catch (error) {
                console.error("Network Error:", error);
                return `⚠️ Network Error: ${error.message}. Please check your connection or CORS settings.`;
            }
        }
        
        window.geminiFetch = sendMessage;
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-effect { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#f9f9f9]">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [messages, setMessages] = useState([
                { role: 'model', content: "Hello! I am Gemini 1.5 Flash. How can I help you today?", timestamp: Date.now() }
            ]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const handleSend = async () => {
                if (!input.trim() || isLoading) return;
                
                const userMsg = { role: 'user', content: input, timestamp: Date.now() };
                setMessages(prev => [...prev, userMsg]);
                setInput('');
                setIsLoading(true);

                try {
                    const text = await window.geminiFetch(input);
                    setMessages(prev => [...prev, { role: 'model', content: text, timestamp: Date.now() }]);
                } catch (error) {
                    console.error(error);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleExport = (format) => {
                let content = format === 'json' 
                    ? JSON.stringify({ messages }, null, 2) 
                    : messages.map(msg => `[${msg.role.toUpperCase()}]: ${msg.content}`).join('\n\n');
                
                const blob = new Blob([content], { type: format === 'json' ? 'application/json' : 'text/plain' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `chat-export.${format}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar */}
                    <div className="w-64 bg-white border-r border-gray-200 flex flex-col hidden md:flex">
                        <div className="p-6">
                            <h2 className="text-xl font-bold flex items-center gap-2">
                                <span className="p-1 bg-black text-white rounded">G</span> Gemini 1.5
                            </h2>
                        </div>
                        <div className="flex-1 overflow-y-auto px-4">
                            <button className="w-full flex items-center gap-2 p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium hover:bg-gray-100 transition-all mb-4">
                                <i data-lucide="plus" class="w-4 h-4"></i> New Chat
                            </button>
                            <div className="space-y-1">
                                <button onClick={() => handleExport('txt')} className="w-full flex items-center gap-2 p-3 hover:bg-gray-50 rounded-xl text-sm text-gray-600">
                                    <i data-lucide="file-text" class="w-4 h-4 text-blue-500"></i> Export TXT
                                </button>
                                <button onClick={() => handleExport('json')} className="w-full flex items-center gap-2 p-3 hover:bg-gray-50 rounded-xl text-sm text-gray-600">
                                    <i data-lucide="file-json" class="w-4 h-4 text-orange-500"></i> Export JSON
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Main Chat Area */}
                    <div className="flex-1 flex flex-col bg-white relative">
                        <div className="p-4 border-b border-gray-100 flex justify-between items-center glass-effect sticky top-0 z-10">
                            <h3 className="font-semibold text-gray-700">Gemini 1.5 Flash</h3>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 custom-scrollbar">
                            <div className="max-w-3xl mx-auto space-y-6">
                                {messages.map((msg, i) => (
                                    <div key={i} className={`flex gap-4 ${msg.role === 'user' ? 'flex-row-reverse' : ''}`}>
                                        <div className={`w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 ${msg.role === 'user' ? 'bg-gray-100' : 'bg-black text-white'}`}>
                                            <i data-lucide={msg.role === 'user' ? 'user' : 'bot'} class="w-5 h-5"></i>
                                        </div>
                                        <div className={`p-4 rounded-2xl max-w-[85%] ${msg.role === 'user' ? 'bg-black text-white rounded-tr-none' : 'bg-gray-50 border border-gray-100 rounded-tl-none shadow-sm'}`}>
                                            <p className="text-sm leading-relaxed whitespace-pre-wrap">{msg.content}</p>
                                        </div>
                                    </div>
                                ))}
                                {isLoading && (
                                    <div className="flex gap-4">
                                        <div className="w-8 h-8 bg-black text-white rounded-lg flex items-center justify-center animate-pulse">
                                            <i data-lucide="bot" class="w-5 h-5"></i>
                                        </div>
                                        <div className="p-4 bg-gray-50 border border-gray-100 rounded-2xl rounded-tl-none animate-pulse">
                                            <div className="text-xs text-gray-400">Gemini is thinking...</div>
                                        </div>
                                    </div>
                                )}
                                <div ref={messagesEndRef} />
                            </div>
                        </div>

                        <div className="p-4 md:p-6 bg-white border-t border-gray-100">
                            <div className="max-w-3xl mx-auto relative">
                                <textarea 
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && !e.shiftKey && (e.preventDefault(), handleSend())}
                                    placeholder="Type your message..."
                                    className="w-full bg-gray-50 border border-gray-200 rounded-2xl p-4 pr-12 focus:outline-none focus:ring-2 focus:ring-black/5 min-h-[56px] max-h-40 resize-none text-sm shadow-sm"
                                    rows="1"
                                />
                                <button 
                                    onClick={handleSend}
                                    disabled={!input.trim() || isLoading}
                                    className="absolute right-3 bottom-3 p-2 bg-black text-white rounded-xl hover:bg-gray-800 disabled:bg-gray-200 shadow-lg"
                                >
                                    <i data-lucide="send" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
